# render.yaml
services:
  - type: web
    name: fountry-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        value: https://fountry.netlify.app
      - key: CACHE_TTL_HOURS
        value: "24"
      - key: AGENT_CONTROL_TOKEN
        sync: false
      - key: ALPACA_LIVE_TRADING_ENABLED
        value: "false"
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: "10000"
    plan: free
