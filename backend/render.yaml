services:
  - type: web
    name: alpha-foundry-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://fountry.netlify.app
      - key: CACHE_TTL_HOURS
        value: "24"
