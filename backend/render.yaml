services:
  - type: web
    name: fountry-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://fountry.netlify.app
      - key: CACHE_TTL_HOURS
        value: "24"
      - key: AGENT_CONTROL_TOKEN
        sync: false
      - key: ALPACA_LIVE_TRADING_ENABLED
        value: "false"
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
